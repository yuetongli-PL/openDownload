<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="openDownload 本地馆藏：解析 Jable、YouTube、抖音，确认后再收入本地目录。">
  <title>openDownload</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e8603f' d='M16 4v14l-5-5-2 2 7 7 7-7-2-2-5 5V4z'/%3E%3Cpath fill='%23e8603f' d='M6 22v6h20v-6h-3v3H9v-3z'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("od-theme") || "system";
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views/home.css">
  <link rel="stylesheet" href="/static/css/views/jable.css">
  <link rel="stylesheet" href="/static/css/views/source.css">
  <link rel="stylesheet" href="/static/css/views/library.css">
  <link rel="stylesheet" href="/static/css/views/tasks.css">
  <link rel="stylesheet" href="/static/css/views/settings.css">
  <link rel="stylesheet" href="/static/css/views/collect.css">
  <link rel="modulepreload" href="/static/js/main.js">
  <link rel="modulepreload" href="/static/js/core/dom.js">
  <link rel="modulepreload" href="/static/js/core/api.js">
  <link rel="modulepreload" href="/static/js/core/store.js">
  <link rel="modulepreload" href="/static/js/core/router.js">
  <link rel="modulepreload" href="/static/js/core/prefs.js">
  <link rel="modulepreload" href="/static/js/core/format.js">
  <link rel="modulepreload" href="/static/js/ui/toast.js">
  <link rel="modulepreload" href="/static/js/ui/icons.js">
  <link rel="modulepreload" href="/static/js/ui/button.js">
  <link rel="modulepreload" href="/static/js/ui/empty.js">
  <link rel="modulepreload" href="/static/js/ui/task-row.js">
  <link rel="modulepreload" href="/static/js/features/tasks.js">
  <link rel="modulepreload" href="/static/js/views/home.js">
</head>
<body>
  <a class="skip" href="#app">跳到主要内容</a>
  <div class="app-shell">
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="工作台导航">
      <a class="brand" href="#/" aria-label="openDownload 首页">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></svg>
        <span class="brand-copy"><strong>openDownload</strong><small>本地媒体工作台</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link" data-nav="home" href="#/">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>
          <span>首页</span>
        </a>
        <p class="nav-label">来源</p>
        <a class="nav-link" data-nav="jable" href="#/jable"><i class="source-dot jable" aria-hidden="true"></i><span>Jable</span></a>
        <a class="nav-link" data-nav="youtube" href="#/youtube"><i class="source-dot youtube" aria-hidden="true"></i><span>YouTube</span></a>
        <a class="nav-link" data-nav="douyin" href="#/douyin"><i class="source-dot douyin" aria-hidden="true"></i><span>抖音</span></a>
        <a class="nav-link" data-nav="library" href="#/library">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v12H3V7Z"/></svg>
          <span>馆藏</span>
        </a>
        <a class="nav-link" data-nav="tasks" href="#/tasks">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>任务</span>
          <span id="nav-task-badge" class="nav-badge" hidden>0</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <a class="nav-link" data-nav="settings" href="#/settings">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 3 3 1 2 4-2 4-3 1-1 3H9l-1-3-3-1-2-4 2-4 3-1 1-3Zm3 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
          <span>设置</span>
        </a>
        <button type="button" id="btn-theme" class="icon-btn" aria-label="切换主题"></button>
        <button type="button" id="btn-collapse" class="icon-btn" aria-label="折叠侧栏"></button>
      </div>
    </aside>
    <header class="topbar">
      <button type="button" id="btn-menu" class="icon-btn menu-btn" aria-label="展开导航" aria-expanded="false" aria-controls="sidebar">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="breadcrumb" aria-label="当前位置">
        <a href="#/" id="crumb-parent">工作台</a>
        <span aria-hidden="true">/</span>
        <span id="crumb-current" aria-current="page">首页</span>
      </nav>
      <label class="global-search">
        <span class="sr-only">全局输入</span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="global-query" type="text" spellcheck="false" placeholder="粘贴链接，或输入用户名 / 番号" aria-label="全局输入">
        <kbd>⌘K</kbd>
      </label>
      <button type="button" id="health-dot" class="health-dot" aria-label="服务状态，打开设置"><i></i><span>本地服务</span></button>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
  <div id="collect-root"></div>
  <div id="tray-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
